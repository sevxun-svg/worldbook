<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>world book</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--txt:#20232a;--muted:#8a909b;--line:#e7e9ee;--a:#6366d9;--soft:#edeefe;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:235px;background:#fcfcfd;border-right:1px solid var(--line);padding:22px 14px}.logo{font-size:20px;font-weight:800;padding:5px 10px 28px;letter-spacing:-.04em}.logo b{background:#20232a;color:#fff;border-radius:8px;padding:5px 8px;margin-right:7px}.nav button{width:100%;border:0;background:transparent;text-align:left;color:#747b87;padding:11px 12px;border-radius:11px;margin:3px 0}.nav button.active,.nav button:hover{background:var(--soft);color:var(--a)}main{flex:1;min-width:0}.top{height:70px;background:#fffffff0;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:10px;position:sticky;top:0;z-index:5}.top input{width:350px;background:#f7f8fa;border:1px solid var(--line);border-radius:11px;padding:10px 13px}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px;color:#5d6470;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{background:#20232a;color:#fff;border-color:#20232a}.content{max-width:1280px;margin:auto;padding:30px}.view{animation:in .24s ease}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1}}.hide{display:none}.ey{font-size:10px;letter-spacing:.18em;color:var(--a);font-weight:800}h1{font-size:31px;letter-spacing:-.045em;margin:6px 0}h2{letter-spacing:-.03em}.muted{font-size:13px;color:var(--muted);line-height:1.7}.card,.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 12px 35px #19203309}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.toolbar{display:flex;align-items:center;gap:8px;margin:18px 0}.spacer{flex:1}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.itemmain{flex:1}.thumb,.empty{width:50px;height:50px;border-radius:13px;background:#eef0f3;object-fit:cover;display:grid;place-items:center;color:#b3bac4}.check{width:17px;height:17px}.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.world .world-actions{display:flex;gap:6px;position:absolute;right:15px;bottom:15px}.charwater{column-count:3;column-gap:15px}.charcard{break-inside:avoid;margin:0 0 15px;padding:0;overflow:hidden;cursor:pointer}.charcard .charhero{width:100%;height:240px;object-fit:cover;display:block}.charcard .charplaceholder{height:240px;display:grid;place-items:center;background:#eef0f3;color:#aab0ba;font-size:36px}.charcard .charbody{padding:13px 15px}.charcard .charname{font-size:18px;font-weight:800}.charcard .charactions{display:flex;gap:7px;margin-top:10px}.subcats{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.subcat{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer}.subcat.active{background:var(--soft);border-color:#cdd0ff;color:var(--a)}.map-actions{display:flex;gap:6px;margin-top:7px}.rel-line{stroke-width:3;stroke:#8b90a0}.rel-label{font-weight:700}@media(max-width:1100px){.charwater{column-count:2}}@media(max-width:650px){.charwater{column-count:1}}.world{min-height:160px;position:relative}.tag{display:inline-block;background:var(--soft);color:var(--a);padding:4px 7px;border-radius:7px;font-size:10px;margin:2px}.editor{display:grid;grid-template-columns:1fr 310px;gap:15px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#777e89}.field input,.field textarea,.field select,.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);background:#fafbfc;border-radius:10px;padding:10px;outline:0}.field textarea{min-height:105px;resize:vertical}.avatar{height:270px;border:1px dashed #d8dce4;border-radius:15px;background:#f7f8fa;display:grid;place-items:center;overflow:hidden;color:#a5abb5}.avatar img{width:100%;height:100%;object-fit:cover}.file{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:9px;font-size:12px;background:#fff;cursor:pointer}.file input{display:none}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.photo{position:relative;aspect-ratio:1;overflow:hidden;border-radius:9px}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:4px;top:4px;border:0;background:#222c;color:#fff;border-radius:6px}.stats{display:grid;gap:10px}.stat{display:grid;grid-template-columns:65px 1fr 38px;gap:8px;align-items:center}.stat label,.stat span{font-size:11px;color:#747b87}.stat span{text-align:right}.stat input{width:100%;accent-color:var(--a)}.add{display:flex;gap:7px;margin-top:10px}.add input{flex:1;border:1px solid var(--line);padding:9px;border-radius:9px}.milestones{display:grid;gap:8px}.mile{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fafbfc}.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.maps{display:grid;grid-template-columns:240px 1fr;gap:15px}.mapcats{display:grid;gap:8px}.mapcat{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;text-align:left}.mapcat.active{background:var(--soft);border-color:#cdd0ff;color:var(--a)}.mapwrap{height:550px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#eceef1}.mapinner{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:contain;transition:transform .45s cubic-bezier(.2,.75,.2,1)}.mapempty{height:100%;display:grid;place-items:center;color:#999}.mapinfo{position:absolute;left:12px;bottom:12px;background:#fffdf;padding:8px 10px;border-radius:9px;font-size:11px}.relations{height:560px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:17px;background-color:#fff;background-image:linear-gradient(#eef0f3 1px,transparent 1px),linear-gradient(90deg,#eef0f3 1px,transparent 1px);background-size:40px 40px}.relations svg{position:absolute;inset:0;width:100%;height:100%}.node{position:absolute;transform:translate(-50%,-50%);text-align:center;width:105px;cursor:pointer;transition:.2s}.node:hover{transform:translate(-50%,-50%) scale(1.06)}.node img,.node .empty{width:62px;height:62px;border:3px solid white;box-shadow:0 5px 15px #18202a12}.node span{display:inline-block;background:#fff;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:700}.timeline{padding-left:30px;position:relative}.timeline:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:1px;background:#dfe2e8}.event{position:relative;padding:10px 0 17px}.event:before{content:"";position:absolute;left:-25px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--a)}.modalbg{display:none;position:fixed;inset:0;background:#10131a66;backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:20px;z-index:20}.modalbg.show{display:flex}.modal{width:min(570px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 25px 80px #10131a25;animation:mi .2s ease}@keyframes mi{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}.stack{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.hint{font-size:11px;color:#a0a5ad;margin-top:8px}.profile{display:grid;grid-template-columns:150px 1fr;gap:15px}.bio{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.bio div{padding:9px;border:1px solid var(--line);background:#fafbfc;border-radius:9px}.bio b{display:block;font-size:10px}.bio span{font-size:11px;color:#777f8b}.toast{position:fixed;right:20px;bottom:20px;background:#20232a;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1}@media(max-width:900px){.side{width:68px}.logo span:last-child,.nav button span{display:none}.content{padding:20px}.grid,.worlds,.settings{grid-template-columns:1fr}.editor,.maps,.profile{grid-template-columns:1fr}.fg,.row{grid-template-columns:1fr}.top input{width:190px}}
</style></head><body>
<div class="app"><aside class="side"><div class="logo"><b>W</b><span>world book</span></div><nav class="nav">
<button class="active" onclick="show('home',this)">⌂ <span>世界总览</span></button><button onclick="show('chars',this)">○ <span>角色档案</span></button><button onclick="show('rels',this)">⌘ <span>人物关系</span></button><button onclick="show('time',this)">◷ <span>时间线</span></button><button onclick="show('maps',this)">◇ <span>世界地图</span></button><button onclick="show('world',this)">◈ <span>世界设定</span></button></nav></aside>
<main><header class="top"><input id="search" placeholder="搜索角色…" oninput="renderChars()"><div class="actions"><button class="btn" onclick="share()">分享</button><button class="btn primary" onclick="newChar()">＋ 新建角色</button></div></header><div class="content">
<section id="home" class="view"><div class="ey">WORLD / COLLECTION</div><h1>world book</h1><p class="muted">管理多套独立世界观，可自定义名称与标签。</p><div class="toolbar"><button class="btn primary" onclick="newWorld()">＋ 新建世界观</button></div><div id="worlds" class="worlds"></div><div class="card" style="margin-top:15px"><div class="muted">当前分享链接</div><div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px"><input id="shareUrl" readonly style="border:1px solid var(--line);padding:10px;border-radius:10px"><button class="btn primary" onclick="copyShare()">复制</button></div></div></section>
<section id="chars" class="view hide"><div class="ey">CHARACTERS</div><h1>角色档案</h1><p class="muted">头像、图册、能力与重要人生经历。</p><div class="toolbar"><button class="btn primary" onclick="newChar()">＋ 新建角色</button><label><input class="check" id="allc" type="checkbox" onchange="allChars(this.checked)"> 全选</label><button class="btn" onclick="batchChars()">批量删除</button></div><div id="charList" class="list"></div></section>
<section id="rels" class="view hide"><div class="ey">RELATIONSHIP GRAPH</div><h1>人物关系</h1><p class="muted">滚轮缩放；点击角色头像查看简介卡片。</p><div class="toolbar"><button class="btn primary" onclick="newRel()">＋ 添加关系</button><button class="btn" onclick="newRelCat()">＋ 新建关系分类</button><div class="spacer"></div><button class="btn" onclick="editRelCat()">编辑分类</button><button class="btn" onclick="deleteRelCat()">删除分类</button></div><div id="relCats" class="subcats"></div><div id="graph" class="relations"></div><div id="relList" class="list" style="margin-top:12px"></div></section>
<section id="time" class="view hide"><div class="ey">TIMELINE</div><h1>故事时间线</h1><div class="toolbar"><button class="btn primary" onclick="newEvent()">＋ 添加事件</button><button class="btn" onclick="newTimeCat()">＋ 新建时间线</button><div class="spacer"></div><button class="btn" onclick="editTimeCat()">编辑时间线</button><button class="btn" onclick="deleteTimeCat()">删除时间线</button><label><input class="check" id="alle" type="checkbox" onchange="allEvents(this.checked)"> 全选</label><button class="btn" onclick="batchEvents()">批量删除</button></div><div id="timeCats" class="subcats"></div><div class="card"><div id="timeline" class="timeline"></div></div></section>
<section id="maps" class="view hide"><div class="ey">MAPS</div><h1>世界地图</h1><p class="muted">多张地图、分类、自定义名称；滚轮缩放并带缓动。</p><div class="toolbar"><button class="btn primary" onclick="newMap()">＋ 新建地图</button><div class="spacer"></div><button class="btn" onclick="zoomMap(-.12)">－</button><button class="btn" onclick="zoomMap(.12)">＋</button></div><div class="maps"><div id="mapcats" class="mapcats"></div><div id="mapwrap" class="mapwrap"><div id="mapinner" class="mapinner"></div><div class="mapinfo" id="mapinfo"></div><label class="file" style="position:absolute;right:12px;top:12px;margin:0">上传地图<input type="file" accept="image/*" onchange="uploadMap(this)"></label></div></div></section>
<section id="world" class="view hide"><div class="ey">WORLD SETTING</div><h1>世界设定</h1><p class="muted">设定项目名称完全自定义，每套世界观独立保存。</p><div class="toolbar"><button class="btn primary" onclick="newSetting()">＋ 新建设定项目</button></div><div id="settings" class="settings"></div></section>
<section id="detail" class="view hide"></section>
</div></main></div><div class="modalbg" id="modal" onclick="backdrop(event)"><div class="modal" onclick="event.stopPropagation()"><h2 id="mh"></h2><div id="mb"></div><div class="hint">点击弹窗外的空白处即可取消。</div></div></div><div class="toast" id="toast"></div>
<script>
const K='worldbook_v3';let gzoom=1,mzoom=1,cid=null,mid=null;
let D={worlds:[{id:1,name:'我的世界观',tags:['默认'],desc:'',chars:[],rels:[],events:[],settings:[{id:1,name:'世界概述',body:''}],maps:[]}],active:1};
const $=x=>document.getElementById(x),W=()=>D.worlds.find(w=>w.id===D.active)||D.worlds[0],E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1400)}
function save(){normalize();localStorage.setItem(K,JSON.stringify(D));renderAll()}
function normalizeWorld(w){
  w.chars=w.chars||[];w.rels=w.rels||[];w.events=w.events||[];w.settings=w.settings||[];w.maps=w.maps||[];
  w.relCats=w.relCats||[{id:1,name:'默认关系'}];w.activeRelCat=w.relCats.find(c=>c.id===w.activeRelCat)?.id||w.relCats[0].id;
  w.timeCats=w.timeCats||[{id:1,name:'主时间线'}];w.activeTimeCat=w.timeCats.find(c=>c.id===w.activeTimeCat)?.id||w.timeCats[0].id;
  w.rels.forEach(r=>{if(!r.cat)r.cat=w.activeRelCat;if(!Array.isArray(r.tags))r.tags=r.type?[r.type]:[]});
  w.events.forEach(e=>{if(!e.cat)e.cat=w.activeTimeCat});
}
function normalize(){D.worlds.forEach(normalizeWorld);if(!D.active&&D.worlds[0])D.active=D.worlds[0].id}
function renderAll(){normalize();renderWorlds();renderChars();renderGraph();renderEvents();renderSettings();renderMaps();renderRelCats();renderTimeCats()}
function show(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.add('hide'));$(id).classList.remove('hide');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');}
function modal(h,b){$('mh').textContent=h;$('mb').innerHTML=b;$('modal').classList.add('show')}function close(){ $('modal').classList.remove('show')}function backdrop(e){if(e.target.id==='modal')close()}document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function newWorld(){modal('新建世界观',`<div class="stack"><input id="wn" placeholder="世界观名称"><input id="wt" placeholder="标签：奇幻、科幻…"><textarea id="wd" placeholder="简短描述"></textarea></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="saveWorld()">创建</button></div>`)}
function saveWorld(){let n=$('wn').value.trim();if(!n)return toast('请输入名称');let w={id:Date.now(),name:n,tags:$('wt').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),desc:$('wd').value,chars:[],rels:[],events:[],settings:[],maps:[],relCats:[{id:1,name:'默认关系'}],activeRelCat:1,timeCats:[{id:1,name:'主时间线'}],activeTimeCat:1};D.worlds.push(w);D.active=w.id;save();close();show('home',document.querySelector('.nav button'));toast('已创建')}
function enterWorld(id){D.active=id;normalize();save();show('chars',document.querySelectorAll('.nav button')[1]);toast('已进入世界观')}
function editWorld(id){let w=D.worlds.find(x=>x.id===id);modal('编辑世界观',`<div class="stack"><input id="wen" value="${E(w.name)}"><input id="wet" value="${E((w.tags||[]).join('，'))}"><textarea id="wed">${E(w.desc||'')}</textarea></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="let x=D.worlds.find(x=>x.id===${id});x.name=$('wen').value.trim()||x.name;x.tags=$('wet').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);x.desc=$('wed').value;save();close()">保存</button></div>`)}
function renameWorld(id){let w=D.worlds.find(x=>x.id===id);modal('重命名世界观',`<div class="stack"><input id="rwn" value="${E(w.name)}"></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="w.name=$('rwn').value.trim()||w.name;save();close()">保存</button></div>`)}
function deleteWorld(id){if(D.worlds.length<=1)return toast('至少保留一个世界观');if(!confirm('确定删除这个世界观及其全部内容吗？'))return;D.worlds=D.worlds.filter(w=>w.id!==id);if(D.active===id)D.active=D.worlds[0].id;save();show('home',document.querySelector('.nav button'))}
function renderWorlds(){ $('worlds').innerHTML=D.worlds.map(w=>`<div class="card world"><div class="ey">WORLD</div><h2 ondblclick="renameWorld(${w.id})" title="双击重命名">${E(w.name)}</h2><p class="muted">${E(w.desc||'暂无描述')}</p>${(w.tags||[]).map(t=>`<span class="tag">${E(t)}</span>`).join('')}<div class="world-actions"><button class="btn" onclick="editWorld(${w.id})">编辑</button><button class="btn" onclick="deleteWorld(${w.id})">删除</button><button class="btn primary" onclick="enterWorld(${w.id})">进入</button></div></div>`).join('')||'<div class="card">暂无世界观</div>') }
function newChar(){let c={id:Date.now(),name:'',age:'',gender:'',race:'',birthday:'',height:'',weight:'',birthplace:'',faction:'',identity:'',personality:'',appearance:'',background:'',item:'',avatar:'',gallery:[],stats:{力量:50,敏捷:50,智力:50,魅力:50,魔力:50,耐力:50,幸运:50},custom:[],miles:[]};W().chars.push(c);save();openChar(c)}
function empty(){return '<div class="empty">＋</div>'}
function fld(l,k,v,full=false,ta=false){return `<div class="field ${full?'full':''}"><label>${l}</label>${ta?`<textarea data-k="${k}">${E(v)}</textarea>`:`<input data-k="${k}" value="${E(v)}">`}</div>`}
function openChar(c){cid=c.id;$('detail').innerHTML=`<div class="ey">CHARACTER PROFILE</div><h1>${E(c.name||'新角色')}</h1><div class="editor"><div class="form"><div class="fg">${fld('姓名','name',c.name)}${fld('年龄','age',c.age)}${fld('性别','gender',c.gender)}${fld('种族','race',c.race)}${fld('生日','birthday',c.birthday)}${fld('身高','height',c.height)}${fld('体重','weight',c.weight)}${fld('出生地','birthplace',c.birthplace)}${fld('所属势力','faction',c.faction)}${fld('身份 / 职业','identity',c.identity)}${fld('性格标签','personality',c.personality)}${fld('外貌描述','appearance',c.appearance,true,true)}${fld('背景故事','background',c.background,true,true)}${fld('专属物品','item',c.item)}</div><h3>能力</h3><div class="stats">${Object.entries(c.stats).map(([k,v])=>`<div class="stat"><label>${E(k)}</label><input type="range" min="0" max="100" value="${v}" oninput="stat('${E(k)}',this.value,this)"><span>${v}</span></div>`).join('')}</div><div class="add"><input id="newstat" placeholder="自定义属性名称"><button class="btn" onclick="addStat()">添加</button></div><div class="stats" style="margin-top:10px">${(c.custom||[]).map((s,i)=>`<div class="stat"><label>${E(s.n)}</label><input type="range" min="0" max="100" value="${s.v}" oninput="customStat(${i},this.value,this)"><span>${s.v}</span></div>`).join('')}</div><h3 style="margin-top:25px">重要人生经历</h3><div class="milestones">${(c.miles||[]).map(m=>`<div class="mile"><b>${E(m.y||'时间未定')} · ${E(m.t)}</b><div class="muted">${E(m.d)}</div></div>`).join('')||'<div class="muted">暂无节点</div>'}</div><button class="btn" style="margin-top:9px" onclick="newMile()">＋ 添加经历节点</button><div class="actions" style="margin-top:18px"><button class="btn" onclick="deleteChar(${c.id})">删除</button><button class="btn primary" onclick="saveChar(${c.id})">保存并返回</button></div></div><aside class="form"><h3>角色头像</h3><div class="avatar">${c.avatar?`<img src="${c.avatar}">`:empty()}</div><label class="file">选择头像<input type="file" accept="image/*" onchange="uploadAvatar(this,${c.id})"></label><h3 style="margin-top:22px">角色图册</h3><label class="file">添加图片<input type="file" multiple accept="image/*" onchange="uploadGallery(this,${c.id})"></label><div class="gallery">${(c.gallery||[]).map((x,i)=>`<div class="photo"><img src="${x}"><button onclick="delPhoto(${c.id},${i})">×</button></div>`).join('')}</div></aside></div>`;show('detail')}
function saveChar(id){let c=W().chars.find(x=>x.id===id);document.querySelectorAll('#detail [data-k]').forEach(x=>c[x.dataset.k]=x.value);save();show('chars',document.querySelectorAll('.nav button')[1]);toast('已保存并返回')}
function deleteChar(id){W().chars=W().chars.filter(c=>c.id!==id);W().rels=W().rels.filter(r=>r.a!==id&&r.b!==id);save();show('chars',document.querySelectorAll('.nav button')[1])}
function renderChars(){let q=($('search').value||'').trim();$('charList').className='charwater';$('charList').innerHTML=W().chars.filter(c=>(c.name||'').includes(q)).map(c=>`<div class="card charcard"><div onclick="openChar(W().chars.find(x=>x.id===${c.id}))">${c.avatar?`<img class="charhero" src="${c.avatar}">`:`<div class="charplaceholder">＋</div>`}</div><div class="charbody"><div class="charname">${E(c.name||'未命名角色')}</div><div class="muted">${E(c.race||'')} · ${E(c.identity||'')}</div><div class="charactions"><button class="btn" onclick="openChar(W().chars.find(x=>x.id===${c.id}))">编辑</button><button class="btn" onclick="deleteChar(${c.id})">删除</button></div></div></div>`).join('')||'<div class="card" style="text-align:center">暂无角色</div>'}
function allChars(v){document.querySelectorAll('.cc').forEach(x=>x.checked=v)}function batchChars(){let a=[...document.querySelectorAll('.cc:checked')].map(x=>+x.dataset.id);if(!a.length)return toast('请先选择角色');W().chars=W().chars.filter(c=>!a.includes(c.id));W().rels=W().rels.filter(r=>!a.includes(r.a)&&!a.includes(r.b));save();toast('已批量删除')}
function file(f,cb){let r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f)}
function uploadAvatar(i,id){file(i.files[0],x=>{W().chars.find(c=>c.id===id).avatar=x;save();openChar(W().chars.find(c=>c.id===id))})}
function uploadGallery(i,id){let c=W().chars.find(c=>c.id===id);[...i.files].forEach(f=>file(f,x=>{c.gallery.push(x);save();openChar(c)}))}
function delPhoto(id,i){let c=W().chars.find(c=>c.id===id);c.gallery.splice(i,1);save();openChar(c)}
function stat(k,v,e){let c=W().chars.find(c=>c.id===cid);c.stats[k]=+v;e.nextElementSibling.textContent=v;save()}function customStat(i,v,e){let c=W().chars.find(c=>c.id===cid);c.custom[i].v=+v;e.nextElementSibling.textContent=v;save()}
function addStat(){let c=W().chars.find(c=>c.id===cid),n=$('newstat').value.trim();if(!n)return toast('请输入属性名称');c.custom.push({n,v:50});save();openChar(c)}
function newMile(){modal('添加人生经历节点',`<div class="stack"><div class="row"><input id="my" placeholder="时间 / 年份"><input id="mt" placeholder="节点名称"></div><textarea id="md" placeholder="经历描述"></textarea></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="saveMile()">保存并返回</button></div>`)}
function saveMile(){let c=W().chars.find(c=>c.id===cid),t=$('mt').value.trim();if(!t)return toast('请输入节点名称');c.miles.push({y:$('my').value,t,d:$('md').value});save();close();openChar(c)}
function newRel(){if(W().chars.length<2)return toast('至少需要两个角色');let o=W().chars.map(c=>`<option value="${c.id}">${E(c.name||'未命名')}</option>`).join('');let cats=W().relCats.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('');modal('添加人物关系',`<div class="stack"><div class="row"><select id="ra">${o}</select><select id="rb">${o}</select></div><select id="rc">${cats}</select><input id="rt" placeholder="关系标签，可输入多个，用逗号分隔"><textarea id="rd" placeholder="关系说明"></textarea></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="saveRel()">保存并返回</button></div>`)}
function saveRel(){let a=+$('ra').value,b=+$('rb').value;if(a===b)return toast('不能选择同一角色');let tags=$('rt').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);W().rels.push({id:Date.now(),a,b,type:tags[0]||'关系',tags,cat:+$('rc').value,desc:$('rd').value});save();close();show('rels',document.querySelectorAll('.nav button')[2])}
function renderRelCats(){let w=W();$('relCats').innerHTML=w.relCats.map(c=>`<button class="subcat ${c.id===w.activeRelCat?'active':''}" onclick="wActiveRelCat(${c.id})">${E(c.name)}</button>`).join('')}
function wActiveRelCat(id){W().activeRelCat=id;save()}
function newRelCat(){modal('新建关系分类',`<div class="stack"><input id="catn" placeholder="分类名称"></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="saveRelCat()">保存</button></div>`)}
function saveRelCat(){let n=$('catn').value.trim();if(!n)return toast('请输入分类名称');let w=W(),c={id:Date.now(),name:n};w.relCats.push(c);w.activeRelCat=c.id;save();close()}
function editRelCat(){let w=W(),c=w.relCats.find(x=>x.id===w.activeRelCat);if(!c)return;modal('编辑关系分类',`<div class="stack"><input id="catn" value="${E(c.name)}"></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="W().relCats.find(x=>x.id===${c.id}).name=$('catn').value.trim()||'未命名分类';save();close()">保存</button></div>`)}
function deleteRelCat(){let w=W();if(w.relCats.length<=1)return toast('至少保留一个关系分类');let id=w.activeRelCat;w.rels=w.rels.filter(r=>r.cat!==id);w.relCats=w.relCats.filter(c=>c.id!==id);w.activeRelCat=w.relCats[0].id;save()}
function renderRelList(){let a=W().rels.filter(r=>r.cat===W().activeRelCat);$('relList').innerHTML=a.map(r=>`<div class="item"><div class="itemmain"><b>${E(W().chars.find(c=>c.id===r.a)?.name||'角色')} ↔ ${E(W().chars.find(c=>c.id===r.b)?.name||'角色')}</b><div class="muted">${E((r.tags&&r.tags[0])||r.type||'关系')}</div></div><button class="btn" onclick="deleteRel(${r.id})">删除</button></div>`).join('')||''}function deleteRel(id){W().rels=W().rels.filter(r=>r.id!==id);save()}function renderGraph(){let box=$('graph'),ids=[...new Set(W().rels.filter(r=>r.cat===W().activeRelCat).flatMap(r=>[r.a,r.b]))],w=box.clientWidth,h=box.clientHeight,cx=w/2,cy=h/2,rr=Math.min(w*.3,230)*gzoom,p={};ids.forEach((id,i)=>{let a=i/Math.max(ids.length,1)*Math.PI*2-Math.PI/2;p[id]={x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr}});let rels=W().rels.filter(r=>r.cat===W().activeRelCat);let defs=`<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#777d8b"/></marker></defs>`;let lines=rels.map(r=>{let a=p[r.a],b=p[r.b];if(!a||!b)return '';let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,off=rels.some(x=>x!==r&&x.a===r.b&&x.b===r.a)?10:0;let x1=a.x+nx*off,y1=a.y+ny*off,x2=b.x+nx*off,y2=b.y+ny*off;let label=(r.tags&&r.tags[0])||r.type||'关系';return `<line class="rel-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#arr)"/><text class="rel-label" x="${(x1+x2)/2+nx*8}" y="${(y1+y2)/2+ny*8}" text-anchor="middle" fill="#777d8b" font-size="10">${E(label)}</text>`}).join('');box.innerHTML=`<svg>${defs}${lines}</svg>`+(ids.length?ids.map(id=>{let c=W().chars.find(x=>x.id===id),q=p[id];return `<div class="node" style="left:${q.x}px;top:${q.y}px" onclick="card(${id})">${c?.avatar?`<img src="${c.avatar}">`:empty()}<span>${E(c?.name||'未命名')}</span></div>`}).join(''):'<div style="display:grid;place-items:center;height:100%;color:#999">暂无关系</div>');box.onwheel=e=>{e.preventDefault();gzoom=Math.max(.5,Math.min(2,gzoom+(e.deltaY<0?.1:-.1)));renderGraph()}}
function card(id){let c=W().chars.find(x=>x.id===id);modal(c?.name||'角色简介',`<div class="profile"><div>${c?.avatar?`<img style="width:100%;height:170px;object-fit:cover;border-radius:14px" src="${c.avatar}">`:empty()}</div><div class="bio">${[['种族',c?.race],['身份',c?.identity],['势力',c?.faction],['年龄',c?.age],['性格',c?.personality],['出生地',c?.birthplace]].map(x=>`<div><b>${x[0]}</b><span>${E(x[1]||'未填写')}</span></div>`).join('')}</div></div><p class="muted">${E(c?.appearance||'暂无简介')}</p><div class="foot"><button class="btn primary" onclick="close()">关闭</button></div>`)}
function newEvent(){let cats=W().timeCats.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('');modal('添加时间线事件',`<div class="stack"><div class="row"><input id="ey" placeholder="时间"><input id="en" placeholder="事件名称"></div><select id="ecat">${cats}</select><textarea id="ed" placeholder="事件描述"></textarea></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="saveEvent()">保存并返回</button></div>`)}
function saveEvent(){let n=$('en').value.trim();if(!n)return toast('请输入事件名称');W().events.push({id:Date.now(),y:$('ey').value,n,d:$('ed').value,cat:+$('ecat').value});save();close();show('time',document.querySelectorAll('.nav button')[3])}
function renderTimeCats(){let w=W();$('timeCats').innerHTML=w.timeCats.map(c=>`<button class="subcat ${c.id===w.activeTimeCat?'active':''}" onclick="wActiveTimeCat(${c.id})">${E(c.name)}</button>`).join('')}
function wActiveTimeCat(id){W().activeTimeCat=id;save()}
function newTimeCat(){modal('新建时间线',`<div class="stack"><input id="tcn" placeholder="时间线名称"></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="saveTimeCat()">保存</button></div>`)}
function saveTimeCat(){let n=$('tcn').value.trim();if(!n)return toast('请输入时间线名称');let w=W(),c={id:Date.now(),name:n};w.timeCats.push(c);w.activeTimeCat=c.id;save();close()}
function editTimeCat(){let w=W(),c=w.timeCats.find(x=>x.id===w.activeTimeCat);if(!c)return;modal('编辑时间线',`<div class="stack"><input id="tcn" value="${E(c.name)}"></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="W().timeCats.find(x=>x.id===${c.id}).name=$('tcn').value.trim()||'未命名时间线';save();close()">保存</button></div>`)}
function deleteTimeCat(){let w=W();if(w.timeCats.length<=1)return toast('至少保留一条时间线');let id=w.activeTimeCat;w.events=w.events.filter(e=>e.cat!==id);w.timeCats=w.timeCats.filter(c=>c.id!==id);w.activeTimeCat=w.timeCats[0].id;save()}
function renderEvents(){$('timeline').innerHTML=W().events.filter(e=>e.cat===W().activeTimeCat).map(e=>`<div class="event"><label><input class="check ec" type="checkbox" data-id="${e.id}"> <b>${E(e.y||'未设置')} · ${E(e.n)}</b></label><p class="muted">${E(e.d||'')}</p><button class="btn" onclick="deleteEvent(${e.id})">删除</button></div>`).join('')||'<div style="padding:40px;text-align:center;color:#999">暂无事件</div>'}
function deleteEvent(id){W().events=W().events.filter(e=>e.id!==id);save()}
function allEvents(v){document.querySelectorAll('.ec').forEach(x=>x.checked=v)}function batchEvents(){let a=[...document.querySelectorAll('.ec:checked')].map(x=>+x.dataset.id);if(!a.length)return toast('请先选择事件');W().events=W().events.filter(e=>!a.includes(e.id));save()}
function newSetting(){modal('新建设定项目',`<div class="stack"><input id="sn" placeholder="项目名称"><textarea id="sb" placeholder="设定内容"></textarea></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="saveSetting()">保存并返回</button></div>`)}
function saveSetting(){let n=$('sn').value.trim();if(!n)return toast('请输入项目名称');W().settings.push({id:Date.now(),name:n,body:$('sb').value});save();close();show('world',document.querySelectorAll('.nav button')[5])}
function renderSettings(){$('settings').innerHTML=W().settings.map(s=>`<div class="card"><div class="ey">SETTING</div><h3 ondblclick="editSetting(${s.id})" title="双击可重命名">${E(s.name)}</h3><p class="muted">${E(s.body||'尚未填写')}</p><button class="btn" onclick="editSetting(${s.id})">编辑</button><button class="btn" onclick="W().settings=W().settings.filter(x=>x.id!==${s.id});save()">删除</button></div>`).join('')||'<div class="card">暂无设定项目</div>'}
function editSetting(id){let s=W().settings.find(x=>x.id===id);modal('编辑世界设定',`<div class="stack"><input id="sn" value="${E(s.name)}"><textarea id="sb">${E(s.body)}</textarea></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="s.name=$('sn').value;s.body=$('sb').value;save();close();show('world',document.querySelectorAll('.nav button')[5])">保存并返回</button></div>`)}
function newMap(){modal('新建地图',`<div class="stack"><input id="mn" placeholder="地图名称"><input id="mc" placeholder="地图分类：大陆 / 国家 / 城市 / 秘境"><p class="muted">地图名称与分类均可自定义。</p></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="saveMap()">创建</button></div>`)}
function saveMap(){let n=$('mn').value.trim();if(!n)return toast('请输入地图名称');let m={id:Date.now(),name:n,cat:$('mc').value.trim()||'未分类',img:''};W().maps.push(m);mid=m.id;save();close();show('maps',document.querySelectorAll('.nav button')[4])}
function renderMaps(){if(!mid&&W().maps[0])mid=W().maps[0].id;$('mapcats').innerHTML=W().maps.map(m=>`<button class="mapcat ${m.id===mid?'active':''}" onclick="mid=${m.id};mzoom=1;renderMaps()"><b>${E(m.name)}</b><div class="muted">${E(m.cat)}</div><div class="map-actions"><button class="btn" onclick="editMap(${m.id});event.stopPropagation()">编辑</button><button class="btn" onclick="deleteMap(${m.id});event.stopPropagation()">删除</button></div></button>`).join('')||'<div class="muted">暂无地图</div>';let m=W().maps.find(x=>x.id===mid);$('mapinner').style.backgroundImage=m?.img?`url("${m.img}")`:'none';$('mapinner').innerHTML=m?.img?'':'<div class="mapempty">上传一张地图图片</div>';$('mapinner').style.transform=`scale(${mzoom})`;$('mapinfo').textContent=m?`${m.name} · ${m.cat} · ${Math.round(mzoom*100)}%`:''}
function editMap(id){let m=W().maps.find(x=>x.id===id);modal('编辑地图',`<div class="stack"><input id="emn" value="${E(m.name)}"><input id="emc" value="${E(m.cat)}"></div><div class="foot"><button class="btn" onclick="close()">取消</button><button class="btn primary" onclick="m.name=$('emn').value.trim()||m.name;m.cat=$('emc').value.trim()||'未分类';save();close()">保存</button></div>`)}
function deleteMap(id){let w=W();if(!confirm('确定删除这张地图吗？'))return;w.maps=w.maps.filter(x=>x.id!==id);if(mid===id)mid=w.maps[0]?.id||null;save()}
function uploadMap(i){let m=W().maps.find(x=>x.id===mid);if(!m)return toast('请先创建地图');file(i.files[0],x=>{m.img=x;save()})}function zoomMap(v){mzoom=Math.max(.5,Math.min(3,mzoom+v));renderMaps()}
$('mapwrap').addEventListener('wheel',e=>{if(!$('maps').classList.contains('hide')){e.preventDefault();zoomMap(e.deltaY<0?.12:-.12)}},{passive:false})
function share(){let u=location.href.split('#')[0]+'#'+btoa(unescape(encodeURIComponent(JSON.stringify(D))));$('shareUrl').value=u;navigator.clipboard?.writeText(u);toast('分享链接已生成')}function copyShare(){navigator.clipboard?.writeText($('shareUrl').value);toast('已复制')}
